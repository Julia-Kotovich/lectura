services:
  postgres:
    image: postgres:16-alpine
    container_name: profdeck-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: profdeck
      POSTGRES_PASSWORD: profdeck_dev
      POSTGRES_DB: profdeck
    volumes:
      - profdeck_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: profdeck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - profdeck_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: profdeck-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: profdeck
      MINIO_ROOT_PASSWORD: profdeck_dev_secret
    command: server /data --console-address ":9001"
    volumes:
      - profdeck_minio_data:/data

volumes:
  profdeck_pg_data:
  profdeck_redis_data:
  profdeck_minio_data:
